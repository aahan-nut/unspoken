<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#3f4a50;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#fff;text-decoration:none}a:hover{color:#fff;opacity:.75}</style>
</helmet>
<div style="padding:clamp(8px,1.6vw,20px);min-height:100vh;box-sizing:border-box;display:flex">
  <div style="position:relative;flex:1;border-radius:clamp(18px,2.4vw,32px);overflow:hidden;background:{{ bg }};box-shadow:0 0 40px rgba(170,200,215,.25);display:grid;grid-template-rows:auto 1fr auto;min-height:max(560px,calc(100vh - 40px));color:#fff">

    <header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:clamp(24px,3.4vw,48px) clamp(24px,6vw,112px) 0">
      <a href="#" style="font-size:clamp(28px,3vw,44px);font-weight:500;letter-spacing:-0.02em;line-height:1">Unspoken</a>
      <nav style="display:flex;flex-wrap:wrap;gap:clamp(18px,2.6vw,40px);font-size:13px;letter-spacing:.08em;text-transform:uppercase">
        <a href="#">Help Me Say It</a>
        <a href="#">Support</a>
        <a href="#">Privacy</a>
      </nav>
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:14px 22px;border:1px solid rgba(255,255,255,.85);border-radius:999px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.08)">
        <svg style="flex:none" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
        Get Immediate Help
      </a>
    </header>

    <main style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),max-content));justify-content:space-between;align-items:center;gap:24px;padding:32px clamp(24px,6vw,112px)">
      <a href="#" style="justify-self:start;white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase">
        <svg style="flex:none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M9 14c.8 1 1.8 1.5 3 1.5s2.2-.5 3-1.5M9 9.5h.01M15 9.5h.01"></path></svg>
        Check in
      </a>
      <div style="display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;max-width:620px">
        <div style="font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.9">Private support, no account needed</div>
        <h1 style="margin:0;font-size:clamp(30px,3.6vw,52px);font-weight:600;line-height:1.08;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance">{{ headline }}</h1>
        <p style="margin:0;font-size:16px;line-height:1.55;max-width:440px;text-wrap:pretty;opacity:.92">Understand how you feel, get support in the moment, and find the words to reach someone you trust.</p>
        <a href="#" style="margin-top:6px;display:flex;align-items:center;gap:10px;padding:15px 28px;border-radius:999px;background:#fff;color:#2f4a58;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase" style-hover="opacity:.9">
          Start a check-in
          <svg style="flex:none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
      </div>
      <a href="#" style="justify-self:end;white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase">
        Find support
        <svg style="flex:none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </a>
    </main>

    <footer style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 clamp(24px,6vw,112px) clamp(24px,3vw,40px)">
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85">
        <svg style="flex:none" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        Stays on your device
      </div>
      <svg style="flex:none" width="14" height="72" viewBox="0 0 14 72" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"><path d="M7 0v70M1 63l6 7 6-7"></path></svg>
      <div style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85">In crisis? Call or text 988</div>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Custom&quot;,&quot;Sky&quot;,&quot;Dusk&quot;,&quot;Sage&quot;],&quot;default&quot;:&quot;Custom&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;hue&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:360,&quot;step&quot;:1,&quot;default&quot;:230,&quot;unit&quot;:&quot;°&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;warmth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:180,&quot;step&quot;:1,&quot;default&quot;:29,&quot;unit&quot;:&quot;°&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Find the words&quot;,&quot;Say it out loud&quot;,&quot;First step&quot;],&quot;default&quot;:&quot;Find the words&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const h = this.props.hue ?? 230, w = h + (this.props.warmth ?? 120);
    const custom = `radial-gradient(60% 50% at 30% 30%, oklch(0.84 0.04 ${h}) 0%, transparent 70%), radial-gradient(50% 45% at 72% 62%, oklch(0.83 0.045 ${w}) 0%, transparent 70%), linear-gradient(160deg, oklch(0.73 0.06 ${h}), oklch(0.63 0.06 ${h + 10}))`;
    if (this.props.tone === 'Custom' || this.props.tone == null) return { bg: custom, headline: ({'Say it out loud':'What goes unsaid deserves to be heard','First step':'The first step toward help starts here'})[this.props.headline] || 'Find the words when it’s hard to speak' };
    const tones = {
      Sky: 'radial-gradient(60% 50% at 30% 30%, #b9d3e0 0%, transparent 70%), radial-gradient(50% 45% at 72% 62%, #d8c3c0 0%, transparent 70%), linear-gradient(160deg,#8fb4c9,#6f98ad)',
      Dusk: 'radial-gradient(60% 50% at 30% 30%, #c9c3de 0%, transparent 70%), radial-gradient(50% 45% at 72% 62%, #e0c4bd 0%, transparent 70%), linear-gradient(160deg,#8b8fb4,#6c7396)',
      Sage: 'radial-gradient(60% 50% at 30% 30%, #c3d6c8 0%, transparent 70%), radial-gradient(50% 45% at 72% 62%, #dcd0bd 0%, transparent 70%), linear-gradient(160deg,#8aa69a,#6b8a7e)'
    };
    const heads = {
      'Find the words': 'Find the words when it’s hard to speak',
      'Say it out loud': 'What goes unsaid deserves to be heard',
      'First step': 'The first step toward help starts here'
    };
    return {
      bg: tones[this.props.tone] || tones.Sky,
      headline: heads[this.props.headline] || heads['Find the words']
    };
  }
}
</script>
</body>
</html>
